<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMARTGURUJI – English FLN LO-Based Work Sheet Generator | Classes 4 to 10</title>
  <style>
    /* ==========================================================================
       SMARTGURUJI – ENGLISH FLN LO-BASED WORK SHEET GENERATOR (SCOPED STYLES)
       Namespace: sgflnpractice2026_
       ========================================================================== */
    body {
      margin: 0;
      padding: 12px;
      background: #e9eff7;
      font-family: Arial, Helvetica, sans-serif;
    }

    #sgflnpractice2026_root,
    #sgflnpractice2026_root * {
      box-sizing: border-box;
    }

    #sgflnpractice2026_root {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.2rem;
      line-height: 1.5;
      color: #1a202c;
      background: #f4f7fb;
      padding: 18px;
      border-radius: 12px;
      max-width: 1080px;
      margin: 0 auto;
    }

    #sgflnpractice2026_root .sgflnpractice2026_hidden {
      display: none !important;
    }

    /* Top Banner */
    #sgflnpractice2026_root .sgflnpractice2026_banner {
      background: linear-gradient(135deg, #1d4ed8 0%, #0f766e 100%);
      color: #ffffff;
      padding: 20px 22px;
      border-radius: 10px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
    }

    #sgflnpractice2026_root .sgflnpractice2026_brand_tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_banner h1 {
      margin: 0 0 6px 0;
      font-size: 1.55rem;
      line-height: 1.3;
      color: #ffffff;
      font-weight: 700;
    }

    #sgflnpractice2026_root .sgflnpractice2026_banner p {
      margin: 0;
      font-size: 1.2rem;
      color: #e6fffa;
    }

    /* Dashboard Panel */
    #sgflnpractice2026_root .sgflnpractice2026_panel {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    #sgflnpractice2026_root .sgflnpractice2026_panel_title {
      margin: 0 0 14px 0;
      font-size: 1.35rem;
      color: #1e3a8a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
      font-weight: 700;
    }

    #sgflnpractice2026_root .sgflnpractice2026_grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_field {
      display: flex;
      flex-direction: column;
    }

    #sgflnpractice2026_root .sgflnpractice2026_field_wide {
      grid-column: span 2;
    }

    #sgflnpractice2026_root .sgflnpractice2026_field_full {
      grid-column: span 3;
    }

    #sgflnpractice2026_root .sgflnpractice2026_field label {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 5px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_field input,
    #sgflnpractice2026_root .sgflnpractice2026_field select {
      width: 100%;
      padding: 10px 12px;
      font-size: 1.2rem;
      font-family: Arial, Helvetica, sans-serif;
      color: #0f172a;
      background: #ffffff;
      border: 1.5px solid #94a3b8;
      border-radius: 6px;
      outline: none;
    }

    #sgflnpractice2026_root .sgflnpractice2026_field input:focus,
    #sgflnpractice2026_root .sgflnpractice2026_field select:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }

    #sgflnpractice2026_root .sgflnpractice2026_field input[readonly] {
      background: #f1f5f9;
      color: #334155;
      font-weight: 700;
    }

    #sgflnpractice2026_root .sgflnpractice2026_lo_box {
      background: #eff6ff;
      border-left: 4px solid #1d4ed8;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 1.2rem;
      color: #1e3a8a;
      font-weight: 600;
    }

    #sgflnpractice2026_root .sgflnpractice2026_alert {
      background: #fef2f2;
      border: 1.5px solid #dc2626;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    #sgflnpractice2026_root .sgflnpractice2026_status_bar {
      background: #ecfdf5;
      border: 1px solid #10b981;
      color: #065f46;
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 14px;
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* Action Buttons */
    #sgflnpractice2026_root .sgflnpractice2026_actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
    }

    #sgflnpractice2026_root .sgflnpractice2026_btn {
      padding: 11px 16px;
      font-size: 1.2rem;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      color: #ffffff;
      transition: opacity 0.15s ease;
    }

    #sgflnpractice2026_root .sgflnpractice2026_btn:hover {
      opacity: 0.92;
    }

    #sgflnpractice2026_root .sgflnpractice2026_btn_primary { background: #1d4ed8; }
    #sgflnpractice2026_root .sgflnpractice2026_btn_secondary { background: #0f766e; }
    #sgflnpractice2026_root .sgflnpractice2026_btn_success { background: #15803d; }
    #sgflnpractice2026_root .sgflnpractice2026_btn_pdf { background: #7c3aed; }
    #sgflnpractice2026_root .sgflnpractice2026_btn_toggle { background: #b45309; }
    #sgflnpractice2026_root .sgflnpractice2026_btn_reset { background: #475569; }

    /* ==========================================================================
       WORKSHEET SHEET CONTAINER (A4 FRIENDLY & B&W PRINT READY)
       ========================================================================== */
    #sgflnpractice2026_root .sgflnpractice2026_sheet {
      position: relative;
      background: #ffffff;
      color: #000000;
      border: 2px solid #1e293b;
      border-radius: 6px;
      padding: 24px 26px;
      margin-bottom: 26px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    #sgflnpractice2026_root .sgflnpractice2026_watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-32deg);
      font-size: 3.4rem;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.045);
      letter-spacing: 5px;
      pointer-events: none;
      white-space: nowrap;
      z-index: 0;
    }

    #sgflnpractice2026_root .sgflnpractice2026_sheet_inner {
      position: relative;
      z-index: 1;
    }

    /* Repeating Print Table Wrapper for Multi-Page Header Support */
    #sgflnpractice2026_root .sgflnpractice2026_print_wrap {
      width: 100%;
      border-collapse: collapse;
    }

    #sgflnpractice2026_root .sgflnpractice2026_print_wrap > thead > tr > th,
    #sgflnpractice2026_root .sgflnpractice2026_print_wrap > tbody > tr > td {
      padding: 0;
      border: none;
      font-weight: 400;
      text-align: left;
    }

    #sgflnpractice2026_root .sgflnpractice2026_repeat_head {
      display: none;
    }

    /* Worksheet Header */
    #sgflnpractice2026_root .sgflnpractice2026_ws_header {
      border-bottom: 2px solid #000000;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_ws_top {
      text-align: center;
      margin-bottom: 10px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_ws_brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #000000;
    }

    #sgflnpractice2026_root .sgflnpractice2026_ws_title {
      font-size: 1.45rem;
      font-weight: 700;
      margin-top: 2px;
      color: #000000;
      letter-spacing: 0.4px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_ws_meta {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.2rem;
    }

    #sgflnpractice2026_root .sgflnpractice2026_ws_meta td {
      padding: 5px 8px;
      border: 1px solid #333333;
      vertical-align: top;
    }

    #sgflnpractice2026_root .sgflnpractice2026_ws_lo_strip {
      margin-top: 8px;
      padding: 7px 10px;
      background: #f3f4f6;
      border: 1px solid #000000;
      font-size: 1.2rem;
    }

    /* Activity Block */
    #sgflnpractice2026_root .sgflnpractice2026_activity {
      border: 1px solid #333333;
      border-radius: 4px;
      padding: 12px 14px;
      margin-bottom: 14px;
      background: #ffffff;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    #sgflnpractice2026_root .sgflnpractice2026_act_head {
      font-weight: 700;
      font-size: 1.2rem;
      color: #000000;
      margin-bottom: 6px;
      border-bottom: 1px dashed #666666;
      padding-bottom: 4px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_act_lang {
      font-size: 1.2rem;
      color: #222222;
      font-weight: 400;
      margin-top: 2px;
      display: block;
    }

    #sgflnpractice2026_root .sgflnpractice2026_act_body {
      font-size: 1.2rem;
      color: #000000;
      margin-top: 8px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_act_body p {
      margin: 0 0 8px 0;
    }

    /* Reading Passage Box */
    #sgflnpractice2026_root .sgflnpractice2026_passage {
      background: #f8f9fa;
      border: 1.5px solid #000000;
      padding: 12px 14px;
      margin-bottom: 14px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    #sgflnpractice2026_root .sgflnpractice2026_passage_title {
      font-weight: 700;
      font-size: 1.25rem;
      margin-bottom: 6px;
      text-decoration: underline;
    }

    /* Tables & Chips */
    #sgflnpractice2026_root .sgflnpractice2026_table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 1.2rem;
    }

    #sgflnpractice2026_root .sgflnpractice2026_table th,
    #sgflnpractice2026_root .sgflnpractice2026_table td {
      border: 1px solid #000000;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    #sgflnpractice2026_root .sgflnpractice2026_table th {
      background: #eeeeee;
      font-weight: 700;
    }

    #sgflnpractice2026_root .sgflnpractice2026_chip_row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    #sgflnpractice2026_root .sgflnpractice2026_chip {
      display: inline-block;
      border: 1.5px solid #000000;
      padding: 4px 11px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: #ffffff;
    }

    #sgflnpractice2026_root .sgflnpractice2026_word_bank {
      border: 1px dashed #000000;
      background: #f8f9fa;
      padding: 6px 10px;
      margin: 6px 0 10px 0;
      font-size: 1.2rem;
    }

    #sgflnpractice2026_root .sgflnpractice2026_line {
      border-bottom: 1px solid #000000;
      height: 28px;
      margin-bottom: 6px;
      width: 100%;
    }

    #sgflnpractice2026_root .sgflnpractice2026_draw_box {
      border: 1.5px solid #000000;
      height: 105px;
      width: 100%;
      margin-top: 8px;
      background: #ffffff;
    }

    #sgflnpractice2026_root .sgflnpractice2026_q_list {
      margin: 6px 0 0 0;
      padding-left: 22px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_q_list li {
      margin-bottom: 8px;
    }

    /* Teacher Observation Box */
    #sgflnpractice2026_root .sgflnpractice2026_obs_box {
      border: 2px solid #000000;
      padding: 12px 14px;
      margin-top: 18px;
      background: #fafafa;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    #sgflnpractice2026_root .sgflnpractice2026_obs_title {
      font-weight: 700;
      font-size: 1.2rem;
      border-bottom: 1px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    #sgflnpractice2026_root .sgflnpractice2026_check_row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin: 8px 0;
    }

    #sgflnpractice2026_root .sgflnpractice2026_box_sq {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 1.5px solid #000000;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Footer */
    #sgflnpractice2026_root .sgflnpractice2026_ws_footer {
      margin-top: 16px;
      padding-top: 8px;
      border-top: 1px solid #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 1.2rem;
      color: #222222;
    }

    /* Answer Key Styling */
    #sgflnpractice2026_root .sgflnpractice2026_ak_sheet {
      border: 2px solid #000000;
      background: #ffffff;
    }

    #sgflnpractice2026_root .sgflnpractice2026_ak_banner {
      background: #eeeeee;
      border-bottom: 2px solid #000000;
      padding: 10px 14px;
      text-align: center;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    #sgflnpractice2026_root .sgflnpractice2026_ak_item {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dotted #666666;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* Mobile Responsiveness */
    @media (max-width: 820px) {
      body {
        padding: 6px;
      }
      #sgflnpractice2026_root {
        padding: 12px;
      }
      #sgflnpractice2026_root .sgflnpractice2026_grid {
        grid-template-columns: 1fr;
      }
      #sgflnpractice2026_root .sgflnpractice2026_field_wide,
      #sgflnpractice2026_root .sgflnpractice2026_field_full {
        grid-column: span 1;
      }
      #sgflnpractice2026_root .sgflnpractice2026_sheet {
        padding: 16px;
      }
      #sgflnpractice2026_root .sgflnpractice2026_btn {
        width: 100%;
        text-align: center;
      }
    }

    /* ==========================================================================
       A4 PORTRAIT PRINT & PDF RULES
       ========================================================================== */
    @page {
      size: A4 portrait;
      margin: 12mm 12mm 14mm 12mm;
    }

    .sgflnpractice2026_print_watermark_fixed {
      display: none;
    }

    @media print {
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
      }

      .sgflnpractice2026_hide_in_print {
        display: none !important;
      }

      #sgflnpractice2026_root {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        border: none !important;
        box-shadow: none !important;
        font-size: 10.5pt !important;
        line-height: 1.4 !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_banner,
      #sgflnpractice2026_root .sgflnpractice2026_panel,
      #sgflnpractice2026_root .sgflnpractice2026_no_print {
        display: none !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_sheet {
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        page-break-after: always !important;
        break-after: page !important;
        overflow: visible !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_sheet:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_ak_sheet {
        page-break-before: always !important;
        break-before: page !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_repeat_head {
        display: flex !important;
        justify-content: space-between !important;
        font-size: 8.5pt !important;
        font-weight: 700 !important;
        color: #333333 !important;
        border-bottom: 1px solid #666666 !important;
        padding-bottom: 3px !important;
        margin-bottom: 8px !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_ws_brand { font-size: 11pt !important; }
      #sgflnpractice2026_root .sgflnpractice2026_ws_title { font-size: 13pt !important; }

      #sgflnpractice2026_root .sgflnpractice2026_ws_meta,
      #sgflnpractice2026_root .sgflnpractice2026_ws_lo_strip,
      #sgflnpractice2026_root .sgflnpractice2026_act_head,
      #sgflnpractice2026_root .sgflnpractice2026_act_lang,
      #sgflnpractice2026_root .sgflnpractice2026_act_body,
      #sgflnpractice2026_root .sgflnpractice2026_table,
      #sgflnpractice2026_root .sgflnpractice2026_word_bank,
      #sgflnpractice2026_root .sgflnpractice2026_obs_title {
        font-size: 10.5pt !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_ws_footer {
        font-size: 8.5pt !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_line {
        height: 22px !important;
      }

      #sgflnpractice2026_root .sgflnpractice2026_watermark {
        display: none !important;
      }

      .sgflnpractice2026_print_watermark_fixed {
        display: block !important;
        position: fixed !important;
        bottom: 4mm !important;
        right: 6mm !important;
        font-family: Arial, sans-serif !important;
        font-size: 8pt !important;
        font-weight: 700 !important;
        color: rgba(0, 0, 0, 0.28) !important;
        letter-spacing: 1px !important;
        z-index: 9999 !important;
        pointer-events: none !important;
      }
    }
  </style>
</head>
<body>

<div id="sgflnpractice2026_root">
  <!-- Fixed Print Watermark (Appears on Every Printed Page) -->
  <div class="sgflnpractice2026_print_watermark_fixed">SMARTGURUJI – smartguruji.in</div>

  <!-- On-Screen Header Banner -->
  <div class="sgflnpractice2026_banner sgflnpractice2026_no_print">
    <span class="sgflnpractice2026_brand_tag">SMARTGURUJI – smartguruji.in</span>
    <h1>SMARTGURUJI – ENGLISH FLN LO-BASED WORK SHEET GENERATOR | CLASSES 4 TO 10</h1>
    <p>Printable, student-friendly Foundational Literacy classroom work sheets for Karnataka Government &amp; Aided Schools.</p>
  </div>

  <!-- Teacher Input Dashboard -->
  <div class="sgflnpractice2026_panel sgflnpractice2026_no_print">
    <h2 class="sgflnpractice2026_panel_title">Teacher Work Sheet Setup</h2>
    <form id="sgflnpractice2026_form" novalidate>
      <div class="sgflnpractice2026_grid">

        <div class="sgflnpractice2026_field sgflnpractice2026_field_wide">
          <label for="sgflnpractice2026_school">School Name</label>
          <input type="text" id="sgflnpractice2026_school" placeholder="e.g., GHPS / GHS Vidyanagar" maxlength="100">
        </div>

        <div class="sgflnpractice2026_field">
          <label for="sgflnpractice2026_district">District (Karnataka)</label>
          <select id="sgflnpractice2026_district">
            <option value="">-- Select District --</option>
            <option value="Bagalkote">Bagalkote</option>
            <option value="Ballari">Ballari</option>
            <option value="Belagavi">Belagavi</option>
            <option value="Bengaluru Rural">Bengaluru Rural</option>
            <option value="Bengaluru Urban">Bengaluru Urban</option>
            <option value="Bidar">Bidar</option>
            <option value="Chamarajanagara">Chamarajanagara</option>
            <option value="Chikkaballapura">Chikkaballapura</option>
            <option value="Chikkamagaluru">Chikkamagaluru</option>
            <option value="Chitradurga">Chitradurga</option>
            <option value="Dakshina Kannada">Dakshina Kannada</option>
            <option value="Davanagere">Davanagere</option>
            <option value="Dharwad">Dharwad</option>
            <option value="Gadag">Gadag</option>
            <option value="Hassan">Hassan</option>
            <option value="Haveri">Haveri</option>
            <option value="Kalaburagi">Kalaburagi</option>
            <option value="Kodagu">Kodagu</option>
            <option value="Kolar">Kolar</option>
            <option value="Koppal">Koppal</option>
            <option value="Mandya">Mandya</option>
            <option value="Mysuru">Mysuru</option>
            <option value="Raichur">Raichur</option>
            <option value="Ramanagara">Ramanagara</option>
            <option value="Shivamogga">Shivamogga</option>
            <option value="Tumakuru">Tumakuru</option>
            <option value="Udupi">Udupi</option>
            <option value="Uttara Kannada">Uttara Kannada</option>
            <option value="Vijayanagara">Vijayanagara</option>
            <option value="Vijayapura">Vijayapura</option>
            <option value="Yadgir">Yadgir</option>
          </select>
        </div>

        <div class="sgflnpractice2026_field">
          <label for="sgflnpractice2026_teacher">Teacher Name</label>
          <input type="text" id="sgflnpractice2026_teacher" placeholder="e.g., Ramesh Kumar" maxlength="80">
        </div>

        <div class="sgflnpractice2026_field">
          <label for="sgflnpractice2026_student">Student Name (Optional)</label>
          <input type="text" id="sgflnpractice2026_student" placeholder="Leave blank for print line" maxlength="80">
        </div>

        <div class="sgflnpractice2026_field">
          <label for="sgflnpractice2026_class">Class</label>
          <select id="sgflnpractice2026_class">
            <option value="4">Class 4</option>
            <option value="5">Class 5</option>
            <option value="6" selected>Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function pick(arr, n) {
    return shuffle(arr).slice(0, Math.min(n, arr.length));
  }

  /* ==========================================================================
     4. LO-1 LETTER STAGE (13 DISTINCT ACTIVITIES)
     ========================================================================== */
  function buildLO1Letter(cfg) {
    var NS = sgflnpractice2026_NS;
    var diff = cfg.difficulty;
    var senior = isSenior(cfg.cls);
    var acts = [];
    var ak = [];

    var alphaU = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    var alphaL = "abcdefghijklmnopqrstuvwxyz".split("");
    var vowels = ["A", "E", "I", "O", "U"];
    var cons = alphaU.filter(function (c) { return vowels.indexOf(c) === -1; });

    // 1. Identify Capital Letters
    var capMix = shuffle(pick(alphaU, 6).concat(pick(alphaL, 6)));
    acts.push({
      title: "Identify Capital Letters — Circle all the capital letters below.",
      langKey: "identify_cap",
      body: '<div class="' + NS + 'chip_row">' + capMix.map(function (c) { return '<span class="' + NS + 'chip">' + c + "</span>"; }).join("") + "</div>"
    });
    ak.push("Capital letters: " + capMix.filter(function (c) { return c === c.toUpperCase(); }).join(", "));

    // 2. Identify Small Letters
    var smMix = shuffle(pick(alphaU, 6).concat(pick(alphaL, 6)));
    acts.push({
      title: "Identify Small Letters — Underline all the small letters below.",
      langKey: "identify_small",
      body: '<div class="' + NS + 'chip_row">' + smMix.map(function (c) { return '<span class="' + NS + 'chip">' + c + "</span>"; }).join("") + "</div>"
    });
    ak.push("Small letters: " + smMix.filter(function (c) { return c === c.toLowerCase(); }).join(", "));

    // 3. Match Capital with Small Letters
    var mLetters = pick(alphaU, diff === "Beginner" ? 5 : 6);
    var mSmall = shuffle(mLetters.map(function (c) { return c.toLowerCase(); }));
    acts.push({
      title: "Match Capital Letters with Small Letters — Write the matching small letter.",
      langKey: "match_case",
      body: '<table class="' + NS + 'table"><thead><tr><th>Column A (Capital)</th><th>Column B (Small)</th><th>Your Match</th></tr></thead><tbody>' +
        mLetters.map(function (c, i) {
          return "<tr><td>" + (i + 1) + ". <strong>" + c + "</strong></td><td>(" + String.fromCharCode(97 + i) + ") <strong>" + mSmall[i] + "</strong></td><td></td></tr>";
        }).join("") + "</tbody></table>"
    });
    ak.push(mLetters.map(function (c) { return c + " - " + c.toLowerCase(); }).join(", "));

    // 4. Fill Missing Letters in Alphabetical Order
    var startI = Math.floor(Math.random() * 14);
    var seq = alphaU.slice(startI, startI + 10);
    var bPos = [1, 3, 6, 8];
    acts.push({
      title: "Missing Letters — Fill in the missing letters in alphabetical order.",
      langKey: "missing_alpha",
      body: '<p style="font-size:1.15em;letter-spacing:2px;font-weight:700;">' +
        seq.map(function (c, i) { return bPos.indexOf(i) !== -1 ? "___" : c; }).join(" &nbsp; ") + "</p>"
    });
    ak.push("Missing letters: " + bPos.map(function (i) { return seq[i]; }).join(", "));

    // 5. Arrange Jumbled Letters in Alphabetical Order
    var j1 = pick(alphaU, 5);
    var j2 = pick(alphaL, 5);
    acts.push({
      title: "Alphabetical Order — Arrange the jumbled letters from A to Z.",
      langKey: "jumbled_alpha",
      body: '<ol class="' + NS + 'q_list"><li>' + j1.join(", ") + " &rarr; _____________________________</li><li>" + j2.join(", ") + " &rarr; _____________________________</li></ol>"
    });
    ak.push("1) " + j1.slice().sort().join(", ") + " | 2) " + j2.slice().sort().join(", "));

    // 6. Circle the Vowels
    var vMix = shuffle(pick(vowels, 4).concat(pick(cons, 8)));
    acts.push({
      title: "Circle the Vowels — Find and circle the vowels (A, E, I, O, U).",
      langKey: "circle_vowels",
      body: '<div class="' + NS + 'chip_row">' + vMix.map(function (c) { return '<span class="' + NS + 'chip">' + c + "</span>"; }).join("") + "</div>"
    });
    ak.push("Vowels: " + vMix.filter(function (c) { return vowels.indexOf(c) !== -1; }).join(", "));

    // 7. Identify Consonants
    var cMix = shuffle(pick(vowels, 3).concat(pick(cons, 6)));
    acts.push({
      title: "Identify Consonants — Write only the consonants from the box below.",
      langKey: "identify_cons",
      body: '<div class="' + NS + 'word_bank"><strong>Letters:</strong> ' + cMix.join(" &nbsp; ") + "</div>" + writingLines(1)
    });
    ak.push("Consonants: " + cMix.filter(function (c) { return vowels.indexOf(c) === -1; }).join(", "));

    // 8. Complete Words Using Missing Vowels
    var vwPool = senior
      ? [{ w: "book", s: "b _ _ k" }, { w: "desk", s: "d _ s k" }, { w: "road", s: "r _ _ d" }, { w: "pen", s: "p _ n" }, { w: "map", s: "m _ p" }, { w: "bus", s: "b _ s" }, { w: "time", s: "t _ m _" }, { w: "farm", s: "f _ r m" }]
      : [{ w: "bag", s: "b _ g" }, { w: "cup", s: "c _ p" }, { w: "sun", s: "s _ n" }, { w: "pen", s: "p _ n" }, { w: "pot", s: "p _ t" }, { w: "hat", s: "h _ t" }, { w: "net", s: "n _ t" }, { w: "pin", s: "p _ n" }];
    var vwPick = pick(vwPool, 6);
    acts.push({
      title: "Complete Words Using Missing Vowels (a, e, i, o, u).",
      langKey: "missing_vowel_word",
      body: '<ol class="' + NS + 'q_list">' + vwPick.map(function (x) { return "<li><strong>" + x.s + "</strong> &rarr; Full word: ____________</li>"; }).join("") + "</ol>"
    });
    ak.push(vwPick.map(function (x) { return x.w; }).join(", "));

    // 9. Match Letters with Familiar Picture Words
    var pics = [
      { l: "B", w: "Book", ic: "book" },
      { l: "C", w: "Clock", ic: "clock" },
      { l: "T", w: "Tree", ic: "tree" },
      { l: "H", w: "House", ic: "house" },
      { l: "S", w: "Sun", ic: "sun" },
      { l: "P", w: "Pen", ic: "pen" }
    ];
    var pPick = pick(pics, 4);
    var pShuf = shuffle(pPick);
    acts.push({
      title: "Match Letters with Familiar Picture Words.",
      langKey: "match_letter_word",
      body: '<table class="' + NS + 'table"><thead><tr><th>Letter</th><th>Picture &amp; Word</th><th>Write Word</th></tr></thead><tbody>' +
        pPick.map(function (p, i) {
          return "<tr><td><strong>" + p.l + "</strong></td><td>" + miniSvg(pShuf[i].ic) + " &nbsp; " + pShuf[i].w + "</td><td></td></tr>";
        }).join("") + "</tbody></table>"
    });
    ak.push(pPick.map(function (p) { return p.l + " - " + p.w; }).join(", "));

    // 10. Identify First and Last Letter
    var flWords = pick(W4, 5).map(function (x) { return x.w; });
    acts.push({
      title: "First and Last Letters — Write the first letter and last letter of each word.",
      langKey: "first_letter",
      body: '<table class="' + NS + 'table"><thead><tr><th>Word</th><th>First Letter</th><th>Last Letter</th></tr></thead><tbody>' +
        flWords.map(function (w) { return "<tr><td><strong>" + w + "</strong></td><td></td><td></td></tr>"; }).join("") + "</tbody></table>"
    });
    ak.push(flWords.map(function (w) { return w + " (" + w[0] + ", " + w[w.length - 1] + ")"; }).join(" | "));

    // 11. Before and After Letters
    var baList = pick(alphaU.slice(1, 25), 4);
    acts.push({
      title: "Before and After Letters — Write the letters that come before and after each given letter.",
      langKey: "before_after",
      body: '<table class="' + NS + 'table"><thead><tr><th>Before</th><th>Given Letter</th><th>After</th></tr></thead><tbody>' +
        baList.map(function (ch) { return "<tr><td></td><td style='text-align:center;'><strong>" + ch + "</strong></td><td></td></tr>"; }).join("") + "</tbody></table>"
    });
    ak.push(baList.map(function (ch) {
      var code = ch.charCodeAt(0);
      return String.fromCharCode(code - 1) + "-" + ch + "-" + String.fromCharCode(code + 1);
    }).join(" | "));

    // 12. Differentiate Vowels and Consonants
    var sortPool = shuffle(pick(vowels, 3).concat(pick(cons, 5)));
    acts.push({
      title: "Differentiate Between Vowels and Consonants — Write each letter in the correct column.",
      langKey: "sort_vc",
      body: '<div class="' + NS + 'word_bank"><strong>Letters:</strong> ' + sortPool.join(" &nbsp; ") + "</div>" +
        '<table class="' + NS + 'table"><thead><tr><th>Vowels</th><th>Consonants</th></tr></thead><tbody><tr><td style="height:42px;"></td><td></td></tr></tbody></table>'
    });
    ak.push("Vowels: " + sortPool.filter(function (c) { return vowels.indexOf(c) !== -1; }).join(", ") +
      " | Consonants: " + sortPool.filter(function (c) { return vowels.indexOf(c) === -1; }).join(", "));

    // 13. Find Target Letter & Write the Alphabet Independently
    var tgt = pick(["B", "D", "M", "P", "R", "S", "T"], 1)[0];
    var gridC = shuffle([tgt, tgt, tgt, tgt].concat(pick(cons.filter(function (c) { return c !== tgt; }), 10)));
    acts.push({
      title: "Find the Letter '" + tgt + "' & Write the Alphabet Independently.",
      langKey: "write_alpha",
      body: "<p><strong>A. Circle every '" + tgt + "' in this group:</strong></p>" +
        '<div class="' + NS + 'chip_row">' + gridC.map(function (c) { return '<span class="' + NS + 'chip">' + c + "</span>"; }).join("") + "</div>" +
        "<p><strong>B. Write A to Z independently:</strong></p>" + writingLines(2)
    });
    ak.push("Target letter '" + tgt + "' appears 4 times. Alphabet: A to Z.");

    return {
      activities: acts,
      answerKey: ak,
      checklist: [
        "Recognises capital and small letters accurately",
        "Identifies vowels and consonants",
        "Arranges letters in alphabetical order",
        "Identifies first and last letters of familiar words"
      ]
    };
  }

  function scramble(word) {
    var arr = word.split("");
    for (var i = 0; i < 8; i++) {
      var s = shuffle(arr).join("");
      if (s !== word) return s;
    }
    return arr.reverse().join("");
  }

        scaffold("school building, flag, tree, sun, windows, ground", "This is a picture of... / There is a... / I can see...") + writingLines(4)
    });
    ak.push("Sample: This is a picture of a school. There is a flag in front of the building. A tall tree stands nearby, and the sun shines in the sky.");

    var objC = pick(["My School Bag", "A Bicycle", "A Blackboard", "A Notebook"], 1)[0];
    acts.push({
      title: "Write 3 Sentences About a Familiar Object: " + objC,
      langKey: "write_ind",
      body: scaffold("colour, size, useful, daily, carry/use", "It is... / I use it to... / It helps me...") + writingLines(3)
    });
    ak.push("Sample (" + objC + "): It is very useful to me every day. It is neat and strong. I take good care of it.");

    var arrW = [
      { w: "clean / water / drink / We / should", a: "We should drink clean water." },
      { w: "every / reads / newspaper / My father / day", a: "My father reads the newspaper every day." },
      { w: "in / birds / fly / sky / The / the", a: "The birds fly in the sky." }
    ];
    acts.push({
      title: "Arrange Given Words and Write Meaningful Sentences",
      langKey: "jumbled_sentence",
      body: '<ol class="' + NS + 'q_list">' + arrW.map(function (x) { return "<li><strong>" + esc(x.w) + "</strong>" + writingLines(1) + "</li>"; }).join("") + "</ol>"
    });
    ak.push(arrW.map(function (x, i) { return (i + 1) + ") " + x.a; }).join(" | "));

    acts.push({
      title: "Write 3 Sentences About Your Best Friend",
      langKey: "write_ind",
      body: scaffold("kind, helpful, study, play, share", "My best friend is... / He/She is... / We...") + writingLines(3)
    });
    ak.push("Sample: My best friend is Kavya. She is kind and helpful. We study and play together at school.");

    var top10 = pick(["A Festival We Celebrate", "My Favourite Game", "A Visit to a Market"], 1)[0];
    acts.push({
      title: "Write 3–5 Sentences About: " + top10,
      langKey: "write_ind",
      body: scaffold("family, friends, enjoy, evening, useful, happy", "We... / It is... / I enjoy...") + writingLines(4)
    });
    ak.push("Sample (" + top10 + "): Accept 3–5 clear sentences describing the topic with correct basic punctuation.");

    var top11 = pick(["A Useful Animal (Cow / Dog)", "A Useful Plant (Neem / Coconut Tree)"], 1)[0];
    acts.push({
      title: "Describe an Animal or a Plant: " + top11,
      langKey: "write_ind",
      body: scaffold("useful, strong/green, village, gives, care", "It is... / It gives us... / We should...") + writingLines(3)
    });
    ak.push("Sample (" + top11 + "): Accept 3 clear factual sentences about its appearance, use, and care.");

    acts.push({
      title: "Write 3–5 Sentences About What You Did Yesterday",
      langKey: "write_ind",
      body: scaffold("woke up, went, studied, played, helped, ate", "Yesterday, I... / Then I... / In the evening, I...") + writingLines(4)
    });
    ak.push("Sample: Yesterday, I woke up early and went to school. I attended my classes and played with my friends. In the evening, I completed my homework.");

    return {
      activities: acts,
      answerKey: ak,
      checklist: [
        "Writes 3–5 meaningful sentences independently",
        "Starts sentences with capital letters and ends with full stops",
        "Uses familiar everyday vocabulary appropriately",
        "Expresses original ideas clearly"
      ]
    };
  }

  /* ==========================================================================
     10. LO-4 EVERYDAY ENGLISH COMMUNICATION (12 PRACTICAL ACTIVITIES)
     ========================================================================== */
  function buildLO4(cfg) {
    var NS = sgflnpractice2026_NS;
    var diff = cfg.difficulty;
    var acts = [];
    var ak = [];

    acts.push({
      title: "Introduce Yourself in 3–5 Sentences",
      langKey: "write_ind",
      body: (diff === "Beginner"
        ? "<p>Hello! My name is __________________. I study in Class ______. I live in __________________. My favourite hobby is __________________. Nice to meet you!</p>"
        : "<p>Write a polite self-introduction mentioning your name, class, place, and hobby.</p>" + writingLines(4))
    });
    ak.push("Sample: Good morning! My name is Sneha. I study in Class " + cfg.cls + ". I live in Tumakuru. I like drawing and playing kho-kho. Nice to meet you!");

    var expr = [
      { e: "Good morning, Sir.", r: "Good morning! How are you?" },
      { e: "Thank you for helping me.", r: "You are welcome." },
      { e: "I am sorry for being late.", r: "That is alright. Please be on time." },
      { e: "May I borrow your pencil?", r: "Yes, sure. Here it is." },
      { e: "How are you today?", r: "I am fine, thank you." }
    ];
    var exprS = shuffle(expr);
    acts.push({
      title: "Match Expressions with Their Responses",
      langKey: "match_expr",
      body: '<table class="' + NS + 'table"><thead><tr><th>Expression</th><th>Response</th><th>Match</th></tr></thead><tbody>' +
        expr.map(function (x, i) { return "<tr><td>" + (i + 1) + ". " + esc(x.e) + "</td><td>(" + String.fromCharCode(97 + i) + ") " + esc(exprS[i].r) + "</td><td></td></tr>"; }).join("") + "</tbody></table>"
    });
    ak.push(expr.map(function (x, i) { return (i + 1) + " - " + x.r; }).join(" | "));

    var sitC = [
      { q: "You want to enter the classroom after class has started. What do you say?", opts: ["Open the door!", "May I come in, Madam?", "I am coming inside."], a: "May I come in, Madam?" },
      { q: "You need drinking water during the break. How do you ask politely?", opts: ["Give water now.", "May I go to drink water, please?", "Water is there."], a: "May I go to drink water, please?" },
      { q: "You did not hear a word the teacher said. What do you say?", opts: ["Excuse me, Sir. Could you please repeat that?", "Say it again fast.", "I don't know."], a: "Excuse me, Sir. Could you please repeat that?" }
    ];
    acts.push({
      title: "Choose the Appropriate Classroom Expression — Tick (✓) the polite expression.",
      langKey: "choose_correct",
      body: '<ol class="' + NS + 'q_list">' + sitC.map(function (s) {
        return "<li><strong>" + esc(s.q) + "</strong><br>" + s.opts.map(function (o) { return '<span class="' + NS + 'box_sq"></span> ' + esc(o) + "<br>"; }).join("") + "</li>";
      }).join("") + "</ol>"
    });
    ak.push(sitC.map(function (s, i) { return (i + 1) + ") " + s.a; }).join(" | "));

    acts.push({
      title: "Complete the Conversation — Asking Someone's Name & Greeting",
      langKey: "dialogue_fill",
      body: (diff !== "Independent" ? '<div class="' + NS + 'word_bank"><strong>Helpful words:</strong> name, Class, Where, meet</div>' : "") +
        "<p><strong>Raju:</strong> Hello! What is your __________?</p>" +
        "<p><strong>Ananya:</strong> Hi! My name is Ananya. Which __________ are you in?</p>" +
        "<p><strong>Raju:</strong> I am in Class " + esc(cfg.cls) + ". __________ do you live?</p>" +
        "<p><strong>Ananya:</strong> I live near the main road. Nice to __________ you!</p>"
    });
    ak.push("name, Class, Where, meet");

    acts.push({
      title: "Asking and Telling the Time — Fill in the Missing Dialogue",
      langKey: "dialogue_fill",
      body: "<p><strong>Student A:</strong> Excuse me, what is the __________ now?</p>" +
        "<p><strong>Student B:</strong> It is half past ten (10:30 AM).</p>" +
        "<p><strong>Student A:</strong> When does the lunch break start?</p>" +
        "<p><strong>Student B:</strong> It starts at ________________________.</p>" +
        "<p><strong>Student A:</strong> ________________________ very much!</p>"
    });
    ak.push("time | Sample: one o'clock / 1:00 PM | Thank you");

    acts.push({
      title: "Respond to Everyday Situations — Permission, Requests & Apologising",
      langKey: "respond_sit",
      body: '<ol class="' + NS + 'q_list">' +
        "<li>You forgot your scale and need to borrow one from a friend." + writingLines(1) + "</li>" +
        "<li>You want to ask your teacher for permission to go to the library." + writingLines(1) + "</li>" +
        "<li>You accidentally dropped your friend's notebook." + writingLines(1) + "</li></ol>"
    });
    ak.push("Sample: 1) Please lend me your scale for a minute. 2) Ma'am, may I go to the library? 3) I am sorry, let me pick it up.");

    acts.push({
      title: "Expressing Likes and Dislikes",
      langKey: "complete_starter",
      body: '<ol class="' + NS + 'q_list">' +
        "<li>I like eating ________________________, but I do not like ________________________.</li>" +
        "<li>I enjoy playing ________________________ with my friends.</li>" +
        "<li>My favourite subject is ________________________.</li></ol>"
    });
    ak.push("Sample: 1) mangoes / bitter gourd 2) kabaddi / cricket 3) Science. (Accept all personal answers.)");

    var dir = [
      "Visitor: Excuse me, can you tell me the way to the post office?",
      "Student: Sure! Walk straight down this road.",
      "Student: Turn left near the bus stand. You will see it on your right.",
      "Visitor: Thank you so much for your help!"
    ];
    acts.push({
      title: "Asking for Directions — Arrange Conversation Sentences in Order (1 to 4)",
      langKey: "order_events",
      body: '<ol class="' + NS + 'q_list">' + shuffle(dir).map(function (d) { return "<li>[ &nbsp;&nbsp; ] &nbsp; " + esc(d) + "</li>"; }).join("") + "</ol>"
    });
    ak.push("Order: 1) " + dir[0] + " 2) " + dir[1] + " 3) " + dir[2] + " 4) " + dir[3]);

    acts.push({
      title: "Expressing Basic Feelings — Fill in the Blanks",
      langKey: "respond_sit",
      body: '<div class="' + NS + 'word_bank"><strong>Feeling Words:</strong> happy &nbsp;|&nbsp; tired &nbsp;|&nbsp; proud &nbsp;|&nbsp; hungry</div>' +
        '<ol class="' + NS + 'q_list">' +
        "<li>After running in the playground, I feel ______________.</li>" +
        "<li>When I help my classmate understand a lesson, I feel ______________.</li>" +
        "<li>Before lunch at 1:00 PM, I feel ______________.</li>" +
        "<li>When I complete my work neatly, I feel ______________.</li></ol>"
    });
    ak.push("1) tired 2) happy / proud 3) hungry 4) proud / happy");

    acts.push({
      title: "Write a Short Dialogue Between Two Students (Daily Routine)",
      langKey: "write_ind",
      body: "<p><strong>Student 1:</strong> What time do you wake up every morning?</p>" +
        "<p><strong>Student 2:</strong> ______________________________________________________________</p>" +
        "<p><strong>Student 1:</strong> What do you do after school?</p>" +
        "<p><strong>Student 2:</strong> ______________________________________________________________</p>"
    });
    ak.push("Sample: Student 2: I wake up at six o'clock. / After school, I play for a while and do my homework.");

    acts.push({
      title: "Talking About Family Members — Answer Simple Questions",
      langKey: "answer_wh",
      body: '<ol class="' + NS + 'q_list"><li>How many members are there in your family?' + writingLines(1) + "</li><li>Who helps you with your studies at home?" + writingLines(1) + "</li></ol>"
    });
    ak.push("Sample: 1) There are five members in my family. 2) My elder sister helps me with my studies.");

    acts.push({
      title: "Role-Play Speaking Practice (Teacher & Student) — Practise with a Partner",
      langKey: "roleplay",
      body: "<p><strong>Situation:</strong> Asking the teacher to explain a new word.</p>" +
        "<p><strong>Student:</strong> Good afternoon, Ma'am. Excuse me, may I ask a doubt?<br>" +
        "<strong>Teacher:</strong> Yes, please tell me.<br>" +
        "<strong>Student:</strong> What is the meaning of the word 'peaceful'?<br>" +
        "<strong>Teacher:</strong> 'Peaceful' means calm and quiet.<br>" +
        "<strong>Student:</strong> Thank you, Ma'am. I understood it now.</p>" +
        '<p><span class="' + NS + 'box_sq"></span> Practised speaking aloud with a partner / teacher</p>'
    });
    ak.push("Oral assessment checklist: Uses polite greetings ('Good afternoon', 'Excuse me', 'Thank you') and speaks clearly.");

    return {
      activities: acts,
      answerKey: ak,
      checklist: [
        "Introduces self and greets friends and teachers politely",
        "Asks for permission, help, and basic needs in English",
        "Uses everyday expressions and responds appropriately",
        "Participates in short pair dialogues and role-plays"
      ]
    };
  }

  /* ==========================================================================
     11. WORK SHEET & ANSWER KEY RENDERERS
     ========================================================================== */
  function buildSheetData(cfg, idx) {
    if (cfg.lo === "LO-1") {
      if (cfg.stage === "letter") return buildLO1Letter(cfg);
      if (cfg.stage === "word") return buildLO1Word();
      if (cfg.stage === "sentence") return buildLO1Sentence(cfg);
      return buildLO1Paragraph(cfg, idx);
    }
    if (cfg.lo === "LO-2") return buildLO2(cfg, idx);
    if (cfg.lo === "LO-3") return buildLO3(cfg);
    return buildLO4(cfg);
  }

  function renderWorksheet(cfg, data, num, total) {
    var NS = sgflnpractice2026_NS;
    var schoolStr = cfg.school ? esc(cfg.school) : "______________________________";
    var distStr = cfg.district ? esc(cfg.district) : "____________________";
    var teacherStr = cfg.teacher ? esc(cfg.teacher) : "______________________";
    var studentStr = cfg.student ? esc(cfg.student) : "__________________________";
    var stageHtml = cfg.lo === "LO-1" ? "<div><strong>Selected Stage:</strong> " + esc(sgflnpractice2026_STAGE_LABELS[cfg.stage]) + "</div>" : "";

    var actsHtml = data.activities.map(function (a, i) {
      return '<div class="' + NS + 'activity">' +
        '<div class="' + NS + 'act_head">Activity ' + (i + 1) + ": " + esc(a.title) + langLine(a.langKey, cfg.lang) + "</div>" +
        '<div class="' + NS + 'act_body">' + a.body + "</div></div>";
    }).join("");

    var checkHtml = data.checklist.map(function (c) {
      return '<div><span class="' + NS + 'box_sq"></span> ' + esc(c) + "</div>";
    }).join("");

    return '<section class="' + NS + 'sheet">' +
      '<div class="' + NS + 'watermark">SMARTGURUJI</div>' +
      '<div class="' + NS + 'sheet_inner">' +
        '<table class="' + NS + 'print_wrap">' +
          '<thead><tr><th><div class="' + NS + 'repeat_head"><span>SMARTGURUJI – ENGLISH FLN WORK SHEET (' + esc(cfg.lo) + ')</span><span>Class ' + esc(cfg.cls) + ' | ' + esc(cfg.difficulty) + ' | Set ' + num + '</span></div></th></tr></thead>' +
          '<tbody><tr><td>' +
            '<div class="' + NS + 'ws_header">' +
              '<div class="' + NS + 'ws_top">' +
                '<div class="' + NS + 'ws_brand">SMARTGURUJI</div>' +
                '<div class="' + NS + 'ws_title">ENGLISH FLN WORK SHEET' + (total > 1 ? " – SET " + num : "") + "</div>" +
              "</div>" +
              '<table class="' + NS + 'ws_meta">' +
                "<tr><td><strong>School Name:</strong> " + schoolStr + "</td><td><strong>District:</strong> " + distStr + "</td></tr>" +
                "<tr><td><strong>Student Name:</strong> " + studentStr + "</td><td><strong>Class:</strong> " + esc(cfg.cls) + " &nbsp;|&nbsp; <strong>Subject:</strong> English</td></tr>" +
                "<tr><td><strong>Teacher Name:</strong> " + teacherStr + "</td><td><strong>Date:</strong> " + todayFormatted() + " &nbsp;|&nbsp; <strong>Duration:</strong> " + esc(cfg.duration) + " mins</td></tr>" +
              "</table>" +
              '<div class="' + NS + 'ws_lo_strip">' +
                "<div><strong>Learning Outcome:</strong> " + esc(sgflnpractice2026_LO_TEXT[cfg.lo]) + "</div>" +
                stageHtml +
                "<div><strong>Practice Level:</strong> " + esc(cfg.difficulty) + " &nbsp;|&nbsp; <strong>Total Activities:</strong> " + data.activities.length + "</div>" +
              "</div>" +
            "</div>" +
            (data.introHtml || "") +
            actsHtml +
            '<div class="' + NS + 'obs_box">' +
              '<div class="' + NS + 'obs_title">Teacher Observation &amp; Learning Progress</div>' +
              '<div class="' + NS + 'check_row">' +
                '<span><span class="' + NS + 'box_sq"></span> Completed independently</span>' +
                '<span><span class="' + NS + 'box_sq"></span> Completed with support</span>' +
                '<span><span class="' + NS + 'box_sq"></span> Needs more practice</span>' +
              "</div>" +
              "<div style='margin-top:8px;'><strong>Skill Checklist (" + esc(cfg.lo) + "):</strong></div>" +
              '<div style="margin-top:4px;">' + checkHtml + "</div>" +
              '<div style="margin-top:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;">' +
                "<span><strong>Teacher Remarks:</strong> ____________________________________</span>" +
                "<span><strong>Teacher Signature:</strong> ____________________</span>" +
              "</div>" +
            "</div>" +
            '<div class="' + NS + 'ws_footer">' +
              "<span>Prepared using SmartGuruji FLN WORK SHEET Generator.</span>" +
              "<span>Page / Sheet " + num + " of " + total + "</span>" +
            "</div>" +
          "</td></tr></tbody>" +
        "</table>" +
      "</div>" +
    "</section>";
  }

  function renderAnswerKey(cfg, allData) {
    var NS = sgflnpractice2026_NS;
    var body = allData.map(function (data, idx) {
      return '<div style="margin-bottom:16px;">' +
        '<h3 style="margin:0 0 8px 0;border-bottom:1.5px solid #000;padding-bottom:4px;">WORK SHEET ' + (idx + 1) + " – " + esc(cfg.lo) +
        (cfg.lo === "LO-1" ? " (" + esc(sgflnpractice2026_STAGE_LABELS[cfg.stage]) + ")" : "") +
        " | Class " + esc(cfg.cls) + " (" + esc(cfg.difficulty) + ")</h3>" +
        data.answerKey.map(function (ans, i) {
          return '<div class="' + NS + 'ak_item"><strong>Activity ' + (i + 1) + ":</strong> " + esc(ans) + "</div>";
        }).join("") + "</div>";
    }).join("");

    return '<section id="' + NS + 'ak_container" class="' + NS + 'sheet ' + NS + 'ak_sheet">' +
      '<div class="' + NS + 'watermark">SMARTGURUJI</div>' +
      '<div class="' + NS + 'sheet_inner">' +
        '<div class="' + NS + 'ak_banner">TEACHER\'S ANSWER KEY</div>' +
        '<p style="margin:0 0 12px 0;font-style:italic;">Note: For open-ended writing and everyday communication activities, sample answers are provided. Accept any grammatically reasonable and meaningful student answer.</p>' +
        body +
        '<div class="' + NS + 'ws_footer">' +
          "<span>Prepared using SmartGuruji FLN WORK SHEET Generator.</span>" +
          "<span>Teacher's Answer Key</span>" +
        "</div>" +
      "</div>" +
    "</section>";
  }

  /* ==========================================================================
     12. DOM EVENTS, VALIDATION & PRINT ISOLATION
     ========================================================================== */
  function $(id) {
    return document.getElementById(sgflnpractice2026_NS + id);
  }

  var akShown = true;
  var hiddenSiblings = [];

  function isolateForPrint() {
    hiddenSiblings = [];
    var el = $("root");
    while (el && el.parentElement && el.tagName !== "BODY") {
      var p = el.parentElement;
      for (var i = 0; i < p.children.length; i++) {
        var sib = p.children[i];
        if (sib !== el && !sib.classList.contains(sgflnpractice2026_NS + "hide_in_print")) {
          sib.classList.add(sgflnpractice2026_NS + "hide_in_print");
          hiddenSiblings.push(sib);
        }
      }
      el = p;
    }
  }

  function restoreAfterPrint() {
    for (var i = 0; i < hiddenSiblings.length; i++) {
      hiddenSiblings[i].classList.remove(sgflnpractice2026_NS + "hide_in_print");
    }
    hiddenSiblings = [];
  }

  window.addEventListener("beforeprint", isolateForPrint);
  window.addEventListener("afterprint", restoreAfterPrint);

  function syncLOControls() {
    var lo = $("lo").value;
    $("lo_desc").textContent = sgflnpractice2026_LO_TEXT[lo] || "";
    if (lo === "LO-1") {
      $("stage_wrap").classList.remove(sgflnpractice2026_NS + "hidden");
      $("focus_wrap").classList.add(sgflnpractice2026_NS + "hidden");
    } else {
      $("stage_wrap").classList.add(sgflnpractice2026_NS + "hidden");
      $("focus_wrap").classList.remove(sgflnpractice2026_NS + "hidden");
      var sel = $("focus");
      sel.innerHTML = "";
      var opts = sgflnpractice2026_FOCUS_OPTIONS[lo] || [];
      for (var i = 0; i < opts.length; i++) {
        var o = document.createElement("option");
        o.value = opts[i].value;
        o.textContent = opts[i].label;
        sel.appendChild(o);
      }
    }
  }

  function readConfig() {
    var cnt = parseInt($("count").value, 10);
    if (isNaN(cnt) || cnt < 1 || cnt > 5) {
      return { error: "Please enter a valid number of WORK SHEETs between 1 and 5." };
    }
    return {
      school: $("school").value.trim(),
      district: $("district").value,
      teacher: $("teacher").value.trim(),
      student: $("student").value.trim(),
      cls: $("class").value,
      lo: $("lo").value,
      stage: $("stage").value,
      focus: $("focus").value || "mixed",
      difficulty: $("difficulty").value,
      duration: $("duration").value,
      count: cnt,
      lang: $("lang").value,
      includeAk: $("ak").value === "yes"
    };
  }

  function generateWorksheets(isAnother) {
    var err = $("error");
    var stat = $("status");
    err.classList.add(sgflnpractice2026_NS + "hidden");

    var cfg = readConfig();
    if (cfg.error) {
      err.textContent = cfg.error;
      err.classList.remove(sgflnpractice2026_NS + "hidden");
      return;
    }

    var allData = [];
    var out = [];
    var offset = isAnother ? Math.floor(Math.random() * PASSAGES.length) : 0;

    for (var i = 0; i < cfg.count; i++) {
      var d = buildSheetData(cfg, i + offset);
      allData.push(d);
      out.push(renderWorksheet(cfg, d, i + 1, cfg.count));
    }

    if (cfg.includeAk) {
      out.push(renderAnswerKey(cfg, allData));
      akShown = true;
      $("btn_toggle_ak").textContent = "Hide Answer Key";
      $("btn_toggle_ak").classList.remove(sgflnpractice2026_NS + "hidden");
    } else {
      akShown = false;
      $("btn_toggle_ak").classList.add(sgflnpractice2026_NS + "hidden");
    }

    $("print_area").innerHTML = out.join("");
    stat.textContent = "Generated " + cfg.count + " WORK SHEET(s) for Class " + cfg.cls + " (" + cfg.lo + ", " + cfg.difficulty + " level) with " + allData[0].activities.length + " activities each.";
    stat.classList.remove(sgflnpractice2026_NS + "hidden");
  }

  function printOrPdf(isPdf) {
    if (!$("print_area").innerHTML.trim()) generateWorksheets(false);
    if (isPdf) {
      var stat = $("status");
      stat.textContent = "In the print dialog, choose 'Save as PDF' as Destination and select A4 Portrait layout.";
      stat.classList.remove(sgflnpractice2026_NS + "hidden");
    }
    isolateForPrint();
    window.print();
    setTimeout(restoreAfterPrint, 500);
  }

  function toggleAk() {
    var akEl = $("ak_container");
    if (!akEl) return;
    akShown = !akShown;
    if (akShown) {
      akEl.classList.remove(sgflnpractice2026_NS + "hidden");
      $("btn_toggle_ak").textContent = "Hide Answer Key";
    } else {
      akEl.classList.add(sgflnpractice2026_NS + "hidden");
      $("btn_toggle_ak").textContent = "Show Answer Key";
    }
  }

  function resetAll() {
    $("form").reset();
    $("subject").value = "English";
    $("class").value = "6";
    $("difficulty").value = "Developing";
    $("duration").value = "30";
    $("count").value = "1";
    $("ak").value = "yes";
    $("error").classList.add(sgflnpractice2026_NS + "hidden");
    $("status").classList.add(sgflnpractice2026_NS + "hidden");
    $("print_area").innerHTML = "";
    syncLOControls();
  }

  $("lo").addEventListener("change", syncLOControls);
  $("btn_gen").addEventListener("click", function () { generateWorksheets(false); });
  $("btn_regen").addEventListener("click", function () { generateWorksheets(true); });
  $("btn_print").addEventListener("click", function () { printOrPdf(false); });
  $("btn_pdf").addEventListener("click", function () { printOrPdf(true); });
  $("btn_toggle_ak").addEventListener("click", toggleAk);
  $("btn_reset").addEventListener("click", resetAll);

  syncLOControls();
  generateWorksheets(false);
})();
